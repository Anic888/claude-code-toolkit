<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="Claude Code Toolkit architecture — how skills, plugins, hooks, and MCP servers integrate">
  <defs>
    <linearGradient id="bgArch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0b1f"/>
      <stop offset="100%" stop-color="#1a1530"/>
    </linearGradient>
    <linearGradient id="claudeCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="480" fill="url(#bgArch)" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#e9d5ff">How the pieces fit together</text>
  <text x="450" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">One toolkit, four integration layers, every Claude Code session</text>

  <!-- Center: Claude Code core -->
  <g transform="translate(450,240)" filter="url(#glow)">
    <circle r="64" fill="url(#claudeCore)" opacity="0.9"/>
    <circle r="64" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <text y="-6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Claude</text>
    <text y="14" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Code</text>
    <text y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#e9d5ff">CLI · agent</text>
  </g>

  <!-- 4 module boxes around the core -->
  <!-- Top-left: Skills -->
  <g transform="translate(80,140)">
    <rect width="200" height="92" rx="10" fill="#1e1a3a" stroke="#8b5cf6" stroke-width="2"/>
    <text x="16" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#a78bfa">⚡ Skills</text>
    <text x="16" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#d4d4d8">~/.claude/skills/</text>
    <text x="16" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9ca3af">Slash-callable expert</text>
    <text x="16" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9ca3af">workflows · 180+ items</text>
  </g>

  <!-- Top-right: Plugins -->
  <g transform="translate(620,140)">
    <rect width="200" height="92" rx="10" fill="#1e1a3a" stroke="#06b6d4" stroke-width="2"/>
    <text x="16" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#22d3ee">📦 Plugins</text>
    <text x="16" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#d4d4d8">~/.claude/plugins/</text>
    <text x="16" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9ca3af">Skill bundles +</text>
    <text x="16" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9ca3af">vendor integrations · 29</text>
  </g>

  <!-- Bottom-left: Hooks -->
  <g transform="translate(80,300)">
    <rect width="200" height="92" rx="10" fill="#1e1a3a" stroke="#ec4899" stroke-width="2"/>
    <text x="16" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#f472b6">🪝 Hooks</text>
    <text x="16" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#d4d4d8">settings.json</text>
    <text x="16" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9ca3af">PreToolUse gates · block</text>
    <text x="16" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9ca3af">unsafe commands</text>
  </g>

  <!-- Bottom-right: MCP -->
  <g transform="translate(620,300)">
    <rect width="200" height="92" rx="10" fill="#1e1a3a" stroke="#f59e0b" stroke-width="2"/>
    <text x="16" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">🔌 MCP Servers</text>
    <text x="16" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#d4d4d8">mcp.json</text>
    <text x="16" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9ca3af">Vendor tools: GitHub,</text>
    <text x="16" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9ca3af">Sentry, Stripe · 15+</text>
  </g>

  <!-- Connectors -->
  <g stroke-width="2" fill="none" stroke-dasharray="5,4" opacity="0.55">
    <path d="M 280 186 Q 360 200 386 218" stroke="#8b5cf6"/>
    <path d="M 620 186 Q 540 200 514 218" stroke="#06b6d4"/>
    <path d="M 280 346 Q 360 290 386 262" stroke="#ec4899"/>
    <path d="M 620 346 Q 540 290 514 262" stroke="#f59e0b"/>
  </g>

  <!-- Footer note -->
  <g transform="translate(450,440)" text-anchor="middle">
    <rect x="-180" y="-18" width="360" height="32" rx="6" fill="#0a0814" stroke="#3b2a5e"/>
    <text y="3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#06b6d4">curl -fsSL install.sh | bash</text>
    <text y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6b7280">one-shot install — see Quick Start</text>
  </g>
</svg>
